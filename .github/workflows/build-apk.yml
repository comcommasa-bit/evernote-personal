name: Build Flutter APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create missing font files (placeholder)
        run: |
          mkdir -p assets/fonts
          # NotoSansJP がなければ空ファイルで代替（ビルドを通すため）
          [ -f assets/fonts/NotoSansJP-Regular.ttf ] || touch assets/fonts/NotoSansJP-Regular.ttf
          [ -f assets/fonts/NotoSansJP-Bold.ttf ] || touch assets/fonts/NotoSansJP-Bold.ttf

      - name: Create Android project files
        run: flutter create --org com.evernote.personal --platforms android .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: evernote-personal-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
